<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Profil — ZyskajNaBank</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main style="max-width:640px;margin:2rem auto;font-family:Arial,Helvetica,sans-serif;">
    <h1>Profil</h1>
    <pre id="user"></pre>
    <button id="logout">Wyloguj</button>
    <p><a href="/">Strona główna</a></p>
  </main>

  <script>
    async function load() {
      const res = await fetch('/php/profile.php');
      if (res.status === 401) {
        window.location.href = '/login.html';
        return;
      }
      const data = await res.json();
      document.getElementById('user').textContent = JSON.stringify(data.user, null, 2);
    }
    document.getElementById('logout').addEventListener('click', async () => {
      await fetch('/php/logout.php', { method: 'POST' });
      window.location.href = '/login.html';
    });
    load();
  </script>
</body>
</html>

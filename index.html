<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ZyskajNaBank — Dashboard</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main style="max-width:900px;margin:2rem auto;font-family:Arial,Helvetica,sans-serif;">
    <header style="display:flex;justify-content:space-between;align-items:center;">
      <h1>ZyskajNaBank — Dashboard</h1>
      <div>
        <span id="greeting"></span>
        <button id="logout">Wyloguj</button>
      </div>
    </header>

    <section id="content">
      <!-- Pusty dashboard: tu można dodać komponenty promocji, statystyki itp. -->
    </section>

    <p><a href="profile.html">Profil</a> · <a href="register.html">Rejestracja</a> · <a href="login.html">Logowanie</a></p>
  </main>

  <script src="/js/auth.js"></script>
  <script>
    function init() {
      const user = (typeof auth_getCurrentUser === 'function') ? auth_getCurrentUser() : null;
      if (!user) {
        // jeśli niezalogowany, przekieruj do strony logowania
        window.location.href = '/login.html';
        return;
      }
      const greet = document.getElementById('greeting');
      greet.textContent = user.displayName ? `Witaj, ${user.displayName}` : `Witaj, ${user.email}`;
      document.getElementById('logout').addEventListener('click', () => { auth_logout(); window.location.href = '/login.html'; });
    }
    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
